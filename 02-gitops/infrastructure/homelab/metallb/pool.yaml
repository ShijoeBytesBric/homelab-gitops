# Applied after MetalLB itself is up (handled by sync-wave ordering).
# IP range must sit outside your router's DHCP range, on the same subnet
# as your Proxmox/k8s nodes (192.168.31.0/24).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: homelab-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.31.50-192.168.31.59
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: homelab-l2adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - homelab-pool
