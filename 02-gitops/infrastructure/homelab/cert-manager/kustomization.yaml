apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# cert-manager itself is installed by the Argo CD Application (Helm chart).
# This overlay only carries cluster-specific config that must apply AFTER the
# CRDs exist — hence a later sync-wave on the Application that references it.
resources:
  - clusterissuer-selfsigned.yaml
