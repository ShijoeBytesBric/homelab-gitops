apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # Wave 1: monitoring after the base networking/add-ons (wave 0).
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 69.*
    helm:
      # The chart ships very large CRDs; skip client-side apply size limits.
      skipCrds: false
      values: |
        # Grafana admin password is auto-generated by the chart and stored in
        # the kube-prometheus-stack-grafana secret (monitoring namespace):
        #   kubectl -n monitoring get secret kube-prometheus-stack-grafana \
        #     -o jsonpath='{.data.admin-password}' | base64 -d
        # NOTE: previously this set grafana.admin.existingSecret to a SOPS
        # secret (grafana-secret) that was never created, so grafana was stuck
        # in CreateContainerConfigError. Leave admin unset so the chart's
        # default (auto-generated password) is used. Empty admin: {} would
        # override the chart default with null and break the subchart render.
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
